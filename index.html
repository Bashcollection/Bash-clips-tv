<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bash Clips TV</title>
<link rel="icon" href="logo.webp">
<style>
  :root{
    --base:#0F172A; --surface:#1E293B; --surface-glass:rgba(30,41,59,.8);
    --border:rgba(51,65,85,.6); --border-hi:rgba(148,163,184,.18);
    --blue:#3B82F6; --blue-deep:#2563EB; --indigo:#4F46E5; --indigo-soft:#818CF8;
    --emerald:#10B981; --emerald-soft:#34D399; --sky:#60A5FA;
    --text:#FFFFFF; --text-2:#CBD5E1; --muted:#94A3B8;
    color-scheme: dark;
    --sunray: repeating-conic-gradient(from 0deg at 50% 28%, rgba(255,255,255,.05) 0deg 3deg, transparent 3deg 12deg, rgba(96,165,250,.07) 12deg 15deg, transparent 15deg 24deg),
      linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 48%, transparent 60%),
      radial-gradient(60% 45% at 50% 28%, rgba(59,130,246,.38), transparent 70%),
      radial-gradient(50% 40% at 88% 82%, rgba(239,68,68,.26), transparent 70%),
      linear-gradient(170deg, #111B33 0%, #0F172A 55%, #0B1222 100%);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--sunray); background-attachment:fixed;
  }

  /* Splash with glowing, floating logo */
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sunray);transition:opacity .4s;z-index:9}
  .boot{display:flex;flex-direction:column;align-items:center;gap:22px}
  .loader{width:170px;height:4px;border-radius:999px;background:rgba(51,65,85,.6);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  .loader i{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#3B82F6,#818CF8,#3B82F6);animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .boot p{color:var(--muted);font-size:.85rem;margin:0;letter-spacing:.08em}
  #splash img{width:200px;max-width:60vw;filter:drop-shadow(0 0 28px rgba(59,130,246,.45));animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .hidden{display:none!important}
  main{max-width:520px;margin:0 auto;padding:20px}

  /* Inputs: recessed glass */
  input{
    font:inherit; width:100%; padding:12px 14px; margin:6px 0; border-radius:12px;
    color:var(--text); background:rgba(15,23,42,.7);
    border:1px solid rgba(71,85,105,.6);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
    transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder{color:var(--muted)}
  input:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(59,130,246,.25)}

  /* Primary CTA: blue to indigo, with a glossy highlight and depth */
  button{
    font:inherit; font-weight:600; width:100%; padding:12px 16px; margin:6px 0;
    border-radius:12px; border:0; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#3B82F6 0%,#2563EB 45%,#4F46E5 100%);
    box-shadow:0 10px 22px -10px rgba(59,130,246,.75),
               inset 0 1px 0 rgba(255,255,255,.35),
               inset 0 -2px 0 rgba(0,0,0,.25);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px) scale(.99)}
  button:focus-visible{outline:2px solid var(--sky);outline-offset:3px}

  /* Secondary: dark glass with a bevel */
  button.alt{
    color:var(--text-2);
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),var(--surface);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
    box-shadow:0 8px 18px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* Glass cards with mirror-like top sheen and depth */
  .card{
    position:relative; border-radius:18px; padding:16px; margin:12px 0;
    background:linear-gradient(145deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.015) 45%,rgba(255,255,255,0) 100%),var(--surface-glass);
    border:1px solid var(--border); border-top-color:var(--border-hi);
    box-shadow:0 18px 40px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }

  /* Top bar: frosted glass */
  .topbar{
    position:sticky; top:0; z-index:5; margin:-20px -20px 12px; padding:14px 20px;
    background:linear-gradient(180deg,rgba(30,41,59,.85),rgba(15,23,42,.7));
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 30px -18px rgba(0,0,0,.9);
  }
  .topbar img{filter:drop-shadow(0 4px 10px rgba(59,130,246,.35))}

  /* Gradient header text */
  .brand-title{
    font-weight:800; letter-spacing:-.01em;
    background:linear-gradient(90deg,#FFFFFF 0%,#93C5FD 50%,#818CF8 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ep-title{color:var(--text)}

  /* Badges and tags */
  .badge-free{
    display:inline-block; margin-left:8px; padding:3px 10px; border-radius:999px;
    font-size:.75rem; font-weight:600; color:var(--emerald-soft);
    background:rgba(16,185,129,.14); border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 14px -4px rgba(16,185,129,.6);
  }
  .tag{color:var(--sky); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em}
  .muted{color:var(--muted); font-size:.85rem}
  h3{margin:0 0 10px; color:var(--text)}

  /* Flex rows and wallet packs */
  .row{display:flex; gap:8px; align-items:center}
  .row>*{flex:1}
  .pack{display:flex; justify-content:space-between; align-items:center; padding:12px 14px}
  .pack span{color:var(--text-2)}
  .pack button{width:auto; flex:none; margin:0; padding:10px 16px}

  /* Video player frame */
  video{
    width:100%; margin-top:10px; border-radius:14px; display:block;
    border:1px solid var(--border);
    box-shadow:0 24px 40px -22px rgba(0,0,0,.9);
  }

  #dbg{position:fixed;left:0;right:0;bottom:0;max-height:28vh;overflow:auto;margin:0;padding:6px 8px;background:rgba(0,0,0,.85);color:#9fe8ff;font:11px/1.4 monospace;white-space:pre-wrap;z-index:99}
  .msg{min-height:1.3em; color:var(--sky); font-size:.9em; margin-top:6px}
  p{color:var(--text-2)}

  @media (prefers-reduced-motion: reduce){ #splash img, .loader i{animation:none} }
</style>
</head>
<body>
<div id="splash"><div class="boot"><img src="logo.webp" alt="Bash Clips TV"><div class="loader"><i></i></div><p>Loading</p></div></div>

<main>
  <section id="auth" class="hidden">
    <img src="logo.webp" alt="Bash Clips TV" style="width:160px;display:block;margin:0 auto">
    <div class="row"><button id="tabIn">Sign in</button><button id="tabUp" class="alt">Sign up (+50 coins)</button></div>
    <button id="google" class="alt">Continue with Google</button>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button id="authGo">Sign in</button>
    <button id="guest" class="alt">Continue browsing as guest</button>
    <div class="msg" id="authMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div class="topbar row"><img src="logo.webp" alt="" style="width:40px;flex:none"><strong class="brand-title">Bash Clips TV</strong><span id="bal" style="text-align:right"></span></div>
    <div class="row" style="margin:12px 0">
      <button id="navCat">Watch</button>
      <button id="navWallet" class="alt">Coins</button>
      <button id="signOut" class="alt">Sign out</button>
    </div>
    <div id="catalog"></div>
    <div class="msg" id="catalogMsg"></div>

    <div id="wallet" class="hidden card">
      <h3>Coin wallet</h3>
      <div class="row">
        <button id="curNGN">Naira (₦)</button>
        <button id="curUSD" class="alt">USD ($)</button>
      </div>
      <div id="packs"></div>
      <div class="msg" id="payMsg"></div>
    </div>
  </section>
</main>

<pre id="dbg"></pre>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script>
const SB_URL = 'https://wmoquxhnaoxeukoxfjod.supabase.co';
const SB_KEY = 'sb_publishable_OO9rGuagJDlgwynMUKrNmw_dOXok8Rz';
const FLW_PUBLIC = 'FLWPUBK-52f32e15b02edeba097cfad41e73a8f3-X';
const sb = supabase.createClient(SB_URL, SB_KEY);

// Display only. The server holds the real prices and coin amounts.
const PACKS = [
  { id: 'p100',  label: '100 coins',         ngn: 1500,  usd: 1.15  },
  { id: 'p300',  label: '300 + 20 bonus',    ngn: 4000,  usd: 3.00  },
  { id: 'p700',  label: '700 + 100 bonus',   ngn: 8500,  usd: 6.50  },
  { id: 'p1500', label: '1,500 + 350 bonus', ngn: 17000, usd: 12.75 },
];

const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);
const say = (id, text) => { $(id).textContent = text; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const dbg = m => { const p = document.getElementById('dbg'); p.textContent += new Date().toLocaleTimeString() + '  ' + m + '\n'; p.scrollTop = p.scrollHeight; };

let mode = 'in', cur = 'NGN', user = null, token = null, guest = false;

/* ---------- Boot: logo in the middle while the app loads ---------- */
const BOOT_MIN_MS = 1500;
let booted = false;
function showSplash() {
  const s = $('splash');
  s.classList.remove('hidden');
  s.style.opacity = 1;
}
function hideSplash() {
  $('splash').style.opacity = 0;
  setTimeout(() => $('splash').classList.add('hidden'), 400);
}
async function enter() {
  show('auth', false);
  show('app', true);
  show('wallet', false);
  await loadCatalog();
  if (user) await loadBalance();
}
// Runs on first load and again after each sign-in: logo in the middle, then the app.
async function bootApp(session) {
  dbg('boot: ' + (session?.user ? 'signed in' : 'no user') + ', showing logo');
  user = session?.user || null;
  token = session?.access_token || null;
  showSplash();
  const start = Date.now();
  try {
    if (user) { await enter(); dbg('app shown'); } else { show('auth', true); dbg('sign-in shown'); }
  } catch (err) {
    dbg('ERROR: ' + err.message);
    show('auth', true);
    say('authMsg', 'Could not load. Check your connection and refresh.');
  }
  const remaining = Math.max(0, BOOT_MIN_MS - (Date.now() - start));
  await new Promise(r => setTimeout(r, remaining));
  hideSplash();
}

// Supabase can report "no session" briefly after a Google return, before the real sign-in arrives.
// Only act on a real session. If none arrives, show the sign-in screen after a short wait.
let currentId = null;
let authTimer = null;
sb.auth.onAuthStateChange((event, session) => {
  dbg('auth event: ' + event + (session?.user ? ' (signed in)' : ' (no session)'));
  if (event === 'SIGNED_OUT') { user = null; token = null; currentId = null; return; }
  if (session?.user) {
    clearTimeout(authTimer);
    user = session.user;
    token = session.access_token;
    if (session.user.id !== currentId) {
      currentId = session.user.id;
      bootApp(session);
    }
    return;
  }
  // No session yet: wait before showing sign-in, so a late sign-in can still take over.
  if (!currentId && !authTimer) {
    authTimer = setTimeout(() => { authTimer = null; dbg('no session after 3s'); if (!currentId) bootApp(null); }, 3000);
  }
});

/* ---------- Sign-in ---------- */
$('tabIn').onclick = () => { mode = 'in'; say('authMsg', ''); };
$('tabUp').onclick = () => { mode = 'up'; say('authMsg', 'Sign up gives you 50 coins.'); };
$('authGo').onclick = async () => {
  const email = $('email').value.trim(), password = $('pass').value;
  const r = mode === 'in'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (r.error) say('authMsg', r.error.message);
  else if (mode === 'up' && !r.data.session) say('authMsg', 'Check your email to confirm, then sign in.');
};
$('google').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
$('guest').onclick = () => { guest = true; enter(); };
$('signOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- Navigation ---------- */
$('navCat').onclick = () => { show('wallet', false); };
$('navWallet').onclick = () => {
  if (!user) { say('catalogMsg', 'Sign in to buy coins.'); return; }
  show('wallet', true);
  renderPacks();
};

/* ---------- Catalog ---------- */
async function loadCatalog() {
  const { data, error } = await sb.from('episodes')
    .select('id, episode_number, is_free, series:series_id(title, genre), episode_videos(video_url)')
    .order('episode_number');
  if (error) { say('catalogMsg', error.message); return; }
  // RLS returns episode_videos only for free or unlocked episodes, so no URL means locked.
  $('catalog').innerHTML = data.map(e => {
    const url = e.episode_videos?.[0]?.video_url;
    return `<div class="card"><strong class="ep-title">${esc(e.series.title)}</strong> · Episode ${e.episode_number}${e.is_free ? '<span class="badge-free">Free</span>' : ''}
      ${url
        ? `<video controls playsinline src="${esc(url)}"></video>`
        : `<p>Locked</p><button onclick="unlock('${e.id}')">Unlock for 12 coins</button>`}
    </div>`;
  }).join('') || '<p>No episodes yet.</p>';
}

window.unlock = async episodeId => {
  if (!user) { say('catalogMsg', 'Sign in to unlock episodes.'); return; }
  const { error } = await sb.rpc('unlock_episode', { p_episode_id: episodeId });
  if (error) {
    say('catalogMsg', error.message.includes('not enough coins') ? 'Not enough coins. Buy more under Coins.' : error.message);
    return;
  }
  say('catalogMsg', '');
  await loadCatalog();
  loadBalance();
};

async function loadBalance() {
  const { data } = await sb.from('profiles').select('coin_balance').eq('id', user.id).single();
  $('bal').textContent = (data?.coin_balance ?? 0) + ' coins';
}

/* ---------- Wallet and payment ---------- */
$('curNGN').onclick = () => { cur = 'NGN'; renderPacks(); };
$('curUSD').onclick = () => { cur = 'USD'; renderPacks(); };

function renderPacks() {
  $('curNGN').className = cur === 'NGN' ? '' : 'alt';
  $('curUSD').className = cur === 'USD' ? '' : 'alt';
  $('packs').innerHTML = PACKS.map(p => `
    <div class="card pack">
      <span>${p.label}</span>
      <button onclick="buy('${p.id}')">${cur === 'NGN' ? '₦' + p.ngn.toLocaleString() : '$' + p.usd.toFixed(2)}</button>
    </div>`).join('');
}

window.buy = async packId => {
  say('payMsg', 'Preparing payment...');
  const r = await fetch('/api/create-payment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ packId, currency: cur }),
  });
  const p = await r.json();
  if (!r.ok) { say('payMsg', p.error); return; }

  FlutterwaveCheckout({
    public_key: FLW_PUBLIC,
    tx_ref: p.tx_ref,
    amount: p.amount,
    currency: p.currency,
    // Naira: bank transfer, card and USSD. Dollars: card only.
    payment_options: cur === 'NGN' ? 'banktransfer,card,ussd' : 'card',
    customer: { email: user.email },
    customizations: { title: 'Bash Clips TV', description: 'Coin pack' },
    callback: async res => {
      if (res.status !== 'successful') { say('payMsg', 'Payment not completed.'); return; }
      say('payMsg', 'Confirming payment...');
      const v = await fetch('/api/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ transaction_id: res.transaction_id, tx_ref: p.tx_ref }),
      });
      const j = await v.json();
      say('payMsg', v.ok ? (j.already ? 'Already credited.' : `+${j.credited} coins added.`) : j.error);
      loadBalance();
    },
  });
};
</script>
</body>
</html>
