<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bash Clips TV</title>
<link rel="icon" href="logo.webp">
<style>
  :root{
    --surface:#1E293B; --surface-glass:rgba(30,41,59,.82);
    --border:rgba(51,65,85,.6); --border-hi:rgba(148,163,184,.18);
    --blue:#3B82F6; --indigo:#4F46E5; --sky:#60A5FA;
    --emerald:#34D399;
    --text:#FFFFFF; --text-2:#CBD5E1; --muted:#94A3B8;
    color-scheme: dark;
    --sunray: repeating-conic-gradient(from 0deg at 50% 28%, rgba(255,255,255,.05) 0deg 3deg, transparent 3deg 12deg, rgba(96,165,250,.07) 12deg 15deg, transparent 15deg 24deg),
      linear-gradient(115deg, transparent 35%, rgba(255,255,255,.08) 48%, transparent 60%),
      radial-gradient(60% 45% at 50% 28%, rgba(59,130,246,.38), transparent 70%),
      radial-gradient(50% 40% at 88% 82%, rgba(239,68,68,.26), transparent 70%),
      linear-gradient(170deg, #111B33 0%, #0F172A 55%, #0B1222 100%);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sunray);background-attachment:fixed}

  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sunray);transition:opacity .4s;z-index:9}
  #splash img{width:200px;max-width:60vw;filter:drop-shadow(0 0 28px rgba(59,130,246,.45));animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .hidden{display:none!important}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 -16px 12px;padding:14px 16px;background:linear-gradient(180deg,rgba(30,41,59,.9),rgba(15,23,42,.75));
    border-bottom:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .brand-title{font-weight:800;background:linear-gradient(90deg,#FFFFFF 0%,#93C5FD 50%,#818CF8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .balchip{width:auto;margin:0;padding:8px 14px;font-size:.9rem;border-radius:999px}

  /* Tabs */
  .tabs{display:flex;gap:8px;margin:0 0 14px}
  .tabs button{flex:1;margin:0}

  input{font:inherit;width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;color:var(--text);background:rgba(15,23,42,.7);border:1px solid rgba(71,85,105,.6);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
  input::placeholder{color:var(--muted)}
  input:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(59,130,246,.25)}

  button{font:inherit;font-weight:600;width:100%;padding:12px 16px;margin:6px 0;border-radius:12px;border:0;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#3B82F6 0%,#2563EB 45%,#4F46E5 100%);
    box-shadow:0 10px 22px -10px rgba(59,130,246,.75),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.25);
    transition:transform .12s ease,filter .2s ease}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px) scale(.99)}
  button:disabled{opacity:.6;cursor:default}
  button.alt{color:var(--text-2);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),var(--surface);
    border:1px solid var(--border);border-top-color:var(--border-hi);box-shadow:0 8px 18px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06)}

  .card{border-radius:18px;padding:16px;margin:12px 0;cursor:pointer;
    background:linear-gradient(145deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.015) 45%,rgba(255,255,255,0) 100%),var(--surface-glass);
    border:1px solid var(--border);border-top-color:var(--border-hi);
    box-shadow:0 18px 40px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .card.plain{cursor:default}
  .card h2{margin:0 0 6px;font-size:1.05rem}
  .card p{margin:4px 0;color:var(--text-2)}
  .badge{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600;color:var(--emerald);
    background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35)}
  .muted{color:var(--muted);font-size:.9rem}
  .big{font-size:2.4rem;font-weight:800;text-align:center;margin:18px 0 6px}
  .center{text-align:center}

  .seg{display:flex;gap:8px}
  .seg button{flex:1;margin:6px 0}

  .pack{display:flex;justify-content:space-between;align-items:center;cursor:default}
  .pack span{color:var(--text-2)}
  .pack button{width:auto;flex:none;margin:0;padding:10px 16px}

  video{width:100%;border-radius:14px;display:block;border:1px solid var(--border);margin-top:8px;background:#000}

  .msg{min-height:1.3em;color:var(--sky);font-size:.92em;margin:8px 2px}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;line-height:1.5;color:#93C5FD;background:rgba(2,6,23,.75);
    border:1px solid var(--border);border-radius:12px;padding:10px 12px;max-height:320px;overflow:auto;white-space:pre-wrap}
  .back{width:auto;margin:0 0 10px;padding:8px 14px;font-size:.9rem}
</style>
</head>
<body>
<div id="splash"><img src="logo.webp" alt="Bash Clips TV"></div>

<!-- Sign-in screen -->
<main class="wrap hidden" id="scr-auth">
  <img src="logo.webp" alt="Bash Clips TV" style="width:160px;display:block;margin:24px auto 8px">
  <div class="seg">
    <button type="button" id="tabIn">Sign in</button>
    <button type="button" id="tabUp" class="alt">Sign up (+50 coins)</button>
  </div>
  <button type="button" id="google" class="alt">Continue with Google</button>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button type="button" id="authGo">Sign in</button>
  <button type="button" id="guest" class="alt">Browse as guest</button>
  <div class="msg" id="authMsg"></div>
</main>

<!-- Signed-in shell -->
<div class="wrap hidden" id="shell">
  <div class="topbar">
    <strong class="brand-title">Bash Clips TV</strong>
    <button type="button" class="balchip" id="balChip" title="Buy coins">— coins</button>
  </div>
  <nav class="tabs">
    <button type="button" id="tWatch">Watch</button>
    <button type="button" id="tCoins" class="alt">Coins</button>
    <button type="button" id="tAccount" class="alt">Account</button>
  </nav>

  <!-- Watch: episode list -->
  <section id="scr-watch">
    <div id="list"></div>
    <div class="msg" id="listMsg"></div>
  </section>

  <!-- Episode: player or unlock -->
  <section id="scr-episode" class="hidden">
    <button type="button" class="alt back" id="epBack">← Back to episodes</button>
    <div class="card plain" id="epCard"></div>
    <div class="msg" id="epMsg"></div>
  </section>

  <!-- Coins: balance only -->
  <section id="scr-coins" class="hidden">
    <div class="card plain center">
      <p class="muted">Your balance</p>
      <div class="big" id="coinsBig">0</div>
      <p class="muted">coins</p>
    </div>
    <button type="button" id="goBuy">Buy coins</button>
  </section>

  <!-- Buy: Flutterwave packs -->
  <section id="scr-buy" class="hidden">
    <button type="button" class="alt back" id="buyBack">← Back to coins</button>
    <div class="card plain">
      <h2>Buy coins</h2>
      <div class="seg">
        <button type="button" id="curNGN">Naira (₦)</button>
        <button type="button" id="curUSD" class="alt">USD ($)</button>
      </div>
      <div id="packs"></div>
      <div class="msg" id="payMsg"></div>
    </div>
  </section>

  <!-- Account: details, sign out, activity log -->
  <section id="scr-account" class="hidden">
    <div class="card plain">
      <p class="muted">Signed in as</p>
      <h2 id="acctEmail"></h2>
      <button type="button" class="alt" id="signOut">Sign out</button>
    </div>
    <div class="card plain">
      <h2>Activity log</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script>
const SB_URL = 'https://wmoquxhnaoxeukoxfjod.supabase.co';
const SB_KEY = 'sb_publishable_OO9rGuagJDlgwynMUKrNmw_dOXok8Rz';
const FLW_PUBLIC = 'FLWPUBK-52f32e15b02edeba097cfad41e73a8f3-X';
const sb = supabase.createClient(SB_URL, SB_KEY);

// Display only. The server holds the real prices and coin amounts.
const PACKS = [
  { id: 'p100',  label: '100 coins',         ngn: 1500,  usd: 1.15  },
  { id: 'p300',  label: '300 + 20 bonus',    ngn: 4000,  usd: 3.00  },
  { id: 'p700',  label: '700 + 100 bonus',   ngn: 8500,  usd: 6.50  },
  { id: 'p1500', label: '1,500 + 350 bonus', ngn: 17000, usd: 12.75 },
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const say = (id, t) => { $(id).textContent = t; };

let mode = 'in', cur = 'NGN', user = null, token = null, shownFor = null;
let fallbackTimer = null;
let episodes = [];
let balance = 0;
let currentEp = null;
const activity = [];

/* ---------- Activity log (visible in Account) ---------- */
function step(text) {
  const line = new Date().toLocaleTimeString() + '  ' + text;
  console.log(line);
  activity.push(line);
  if (activity.length > 200) activity.shift();
  $('log').textContent = activity.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
}

/* ---------- Screen switching ---------- */
const SCREENS = ['scr-auth','scr-watch','scr-episode','scr-coins','scr-buy','scr-account'];
function go(name) {
  SCREENS.forEach(s => $(s)?.classList.toggle('hidden', s !== name));
  const inShell = name !== 'scr-auth';
  $('shell').classList.toggle('hidden', !inShell);
  document.querySelectorAll('.tabs button').forEach(b => b.className = b.id === tabFor(name) ? '' : 'alt');
  window.scrollTo(0, 0);
}
function tabFor(screen) {
  if (screen === 'scr-coins' || screen === 'scr-buy') return 'tCoins';
  if (screen === 'scr-account') return 'tAccount';
  return 'tWatch';
}

/* ---------- Balance ---------- */
async function loadBalance() {
  if (!user) return;
  const { data, error } = await sb.from('profiles').select('coin_balance').eq('id', user.id).single();
  if (error) { step('balance error: ' + error.message); return; }
  balance = data?.coin_balance ?? 0;
  $('balChip').textContent = balance + ' coins';
  $('coinsBig').textContent = balance;
}

/* ---------- Session router ---------- */
async function route(session) {
  clearTimeout(fallbackTimer); fallbackTimer = null;
  if (!session?.user) {
    user = null; token = null; shownFor = null;
    step('no session: showing sign-in');
    $('shell').classList.add('hidden');
    go('scr-auth');
    return;
  }
  user = session.user; token = session.access_token;
  if (shownFor === user.id) return;
  shownFor = user.id;
  step('signed in as ' + user.email);
  $('acctEmail').textContent = user.email;
  await loadCatalog();
  await loadBalance();
  go('scr-watch');
}

sb.auth.onAuthStateChange((event, session) => {
  step('auth event: ' + event + (session?.user ? ' (session)' : ' (no session)'));
  if (event === 'SIGNED_OUT') { route(null); return; }
  if (session?.user) { route(session); return; }
  if (!fallbackTimer && !user) {
    fallbackTimer = setTimeout(() => { fallbackTimer = null; if (!user) route(null); }, 2500);
  }
});

/* ---------- Sign-in / sign-up ---------- */
function setMode(next) {
  mode = next;
  $('tabIn').className = mode === 'in' ? '' : 'alt';
  $('tabUp').className = mode === 'up' ? '' : 'alt';
  $('authGo').textContent = mode === 'in' ? 'Sign in' : 'Create account (+50 coins)';
  say('authMsg', mode === 'up' ? 'Sign up gives you 50 coins.' : '');
}
$('tabIn').onclick = () => setMode('in');
$('tabUp').onclick = () => setMode('up');
setMode('in');

let busy = false;
$('authGo').onclick = async () => {
  if (busy) return;
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || !password) { say('authMsg', 'Enter your email and password.'); return; }
  if (mode === 'up' && password.length < 6) { say('authMsg', 'Password must be at least 6 characters.'); return; }
  busy = true; $('authGo').disabled = true;
  step((mode === 'in' ? 'sign-in' : 'sign-up') + ' for ' + email);
  say('authMsg', mode === 'in' ? 'Signing in...' : 'Creating your account...');
  try {
    const r = mode === 'in'
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password });
    if (r.error) { step('auth error: ' + r.error.message); say('authMsg', r.error.message); return; }
    step('auth ok, session: ' + (r.data.session ? 'yes' : 'no'));
    if (r.data.session) { await route(r.data.session); return; }
    say('authMsg', 'Check your email to confirm, then sign in. (To skip this, turn off Confirm email in Supabase.)');
  } catch (err) {
    step('auth exception: ' + err.message);
    say('authMsg', 'Something went wrong: ' + err.message);
  } finally {
    busy = false; $('authGo').disabled = false;
  }
};
$('google').onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
$('guest').onclick = () => { step('browsing as guest'); $('shell').classList.remove('hidden'); loadCatalog(); go('scr-watch'); };

/* ---------- Tabs ---------- */
$('tWatch').onclick = () => { go('scr-watch'); loadCatalog(); };
$('tCoins').onclick = () => { go('scr-coins'); loadBalance(); };
$('tAccount').onclick = () => go('scr-account');
$('balChip').onclick = () => { if (!user) { go('scr-auth'); return; } renderPacks(); go('scr-buy'); };
$('goBuy').onclick = () => { renderPacks(); go('scr-buy'); };
$('buyBack').onclick = () => go('scr-coins');
$('epBack').onclick = () => go('scr-watch');

$('signOut').onclick = async () => {
  step('sign-out tapped');
  const { error } = await sb.auth.signOut();
  if (error) step('sign-out error: ' + error.message);
  route(null);
};

/* ---------- Catalog (Watch screen) ---------- */
async function loadCatalog() {
  const { data, error } = await sb.from('episodes')
    .select('id, episode_number, is_free, coin_cost, series:series_id(title), episode_videos(video_url)')
    .order('episode_number');
  if (error) { say('listMsg', error.message); step('catalog error: ' + error.message); return; }
  episodes = data;
  step('catalog loaded: ' + data.length + ' episodes');
  const html = data.map(e => {
    const unlocked = !!e.episode_videos?.[0]?.video_url;
    const status = e.is_free ? '<span class="badge">Free</span>' : (unlocked ? '' : `<span class="muted"> · ${e.coin_cost} coins</span>`);
    return `<div class="card" onclick="openEpisode('${e.id}')">
      <h2>${esc(e.series.title)} · Episode ${e.episode_number} ${status}</h2>
      <p class="muted">${unlocked || e.is_free ? 'Tap to watch' : 'Tap to unlock'}</p>
    </div>`;
  }).join('');
  $('list').innerHTML = html || '<p class="muted">No episodes yet.</p>';
}

/* ---------- Episode screen: player or unlock ---------- */
window.openEpisode = id => {
  const e = episodes.find(x => x.id === id);
  if (!e) return;
  currentEp = e;
  const url = e.episode_videos?.[0]?.video_url;
  const title = `${esc(e.series.title)} · Episode ${e.episode_number}`;
  say('epMsg', '');
  if (url) {
    $('epCard').innerHTML = `<h2>${title}</h2><video controls playsinline src="${esc(url)}"></video>`;
  } else if (e.is_free) {
    $('epCard').innerHTML = `<h2>${title}</h2><p>This free episode has no video link yet. Check episode_videos in the database.</p>`;
  } else {
    $('epCard').innerHTML = `<h2>${title}</h2>
      <p>Locked. Unlock this episode for ${e.coin_cost} coins.</p>
      <p class="muted">Your balance: ${balance} coins</p>
      <button type="button" id="unlockBtn">Unlock for ${e.coin_cost} coins</button>`;
    $('unlockBtn').onclick = () => unlock(e.id);
  }
  go('scr-episode');
};

async function unlock(episodeId) {
  if (!user) { say('epMsg', 'Sign in to unlock episodes.'); return; }
  const btn = $('unlockBtn'); if (btn) btn.disabled = true;
  say('epMsg', 'Unlocking...');
  step('unlock tapped for ' + episodeId);
  const { error } = await sb.rpc('unlock_episode', { p_episode_id: episodeId });
  if (error) {
    step('unlock error: ' + error.message);
    say('epMsg', error.message.includes('not enough coins') ? 'Not enough coins. Buy more under Coins.' : error.message);
    if (btn) btn.disabled = false;
    return;
  }
  await loadCatalog();
  await loadBalance();
  step('unlock ok, balance now ' + balance);
  openEpisode(episodeId);
  say('epMsg', 'Unlocked. ' + (currentEp?.coin_cost || 0) + ' coins were deducted. Balance: ' + balance + '.');
}

/* ---------- Buy screen ---------- */
$('curNGN').onclick = () => { cur = 'NGN'; renderPacks(); };
$('curUSD').onclick = () => { cur = 'USD'; renderPacks(); };

function renderPacks() {
  $('curNGN').className = cur === 'NGN' ? '' : 'alt';
  $('curUSD').className = cur === 'USD' ? '' : 'alt';
  $('packs').innerHTML = PACKS.map(p => `
    <div class="card plain pack">
      <span>${p.label}</span>
      <button type="button" onclick="buy('${p.id}')">${cur === 'NGN' ? '₦' + p.ngn.toLocaleString() : '$' + p.usd.toFixed(2)}</button>
    </div>`).join('');
}

window.buy = async packId => {
  step('buy tapped: ' + packId + ' ' + cur);
  if (!user) { say('payMsg', 'Sign in to buy coins.'); return; }
  say('payMsg', 'Preparing payment...');
  if (typeof FlutterwaveCheckout !== 'function') {
    step('Flutterwave script not loaded');
    say('payMsg', 'Payment window could not load. Check your connection and refresh.');
    return;
  }
  try {
    const r = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ packId, currency: cur }),
    });
    const p = await r.json().catch(() => ({}));
    if (!r.ok) {
      step('create-payment ' + r.status + ': ' + (p.error || 'failed'));
      say('payMsg', p.error || 'Could not start payment (' + r.status + '). See Account → Activity log.');
      return;
    }
    step('create-payment ok, tx_ref ' + p.tx_ref);
    say('payMsg', '');
    FlutterwaveCheckout({
      public_key: FLW_PUBLIC,
      tx_ref: p.tx_ref,
      amount: p.amount,
      currency: p.currency,
      payment_options: cur === 'NGN' ? 'banktransfer,card,ussd' : 'card',
      customer: { email: user.email },
      customizations: { title: 'Bash Clips TV', description: 'Coin pack' },
      callback: async res => {
        step('flutterwave status: ' + res.status);
        if (res.status !== 'successful') { say('payMsg', 'Payment not completed.'); return; }
        say('payMsg', 'Confirming payment...');
        try {
          const v = await fetch('/api/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ transaction_id: res.transaction_id, tx_ref: p.tx_ref }),
          });
          const j = await v.json().catch(() => ({}));
          step('verify-payment ' + v.status + ': ' + JSON.stringify(j));
          say('payMsg', v.ok ? (j.already ? 'Already credited.' : `+${j.credited} coins added.`) : (j.error || 'Could not confirm payment.'));
        } catch (err) {
          step('verify error: ' + err.message);
          say('payMsg', 'Could not confirm payment: ' + err.message);
        }
        await loadBalance();
      },
      onclose: () => { step('payment window closed'); say('payMsg', ''); },
    });
  } catch (err) {
    step('buy error: ' + err.message);
    say('payMsg', 'Payment failed to start: ' + err.message);
  }
};

step('page loaded');
hideSplashLater();
function hideSplashLater() {
  setTimeout(() => { const s = $('splash'); s.style.opacity = 0; setTimeout(() => s.classList.add('hidden'), 400); }, 900);
}
</script>
</body>
</html>
